<div class="upload-wrap">
  <div class="dropzone"
       [class.active]="isDragOver"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)"
       (click)="fileInput.click()">
    <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" hidden />
    <div class="dropzone-icon">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L8 8m4-4l4 4M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/>
      </svg>
    </div>
    <p class="dropzone-text">Arraste uma imagem ou clique para selecionar</p>
    <p class="dropzone-hint">PNG, JPG — imagem dermatoscópica</p>
  </div>

  <div *ngIf="selectedFile" class="file-preview">
    <div class="file-info">
      <span class="file-name">{{ selectedFile.name }}</span>
      <span class="file-size">{{ formatFileSize(selectedFile.size) }}</span>
    </div>
    <div class="file-actions">
      <button class="btn-remove" (click)="removeFile()">Remover</button>
      <button class="btn-analyze" (click)="uploadImage()" [disabled]="isUploading">
        <span *ngIf="!isUploading">Analisar</span>
        <span *ngIf="isUploading" class="loading">
          <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" opacity="0.2"/>
            <path d="M12 2a10 10 0 019.95 9" stroke-linecap="round"/>
          </svg>
          Analisando...
        </span>
      </button>
    </div>
  </div>

  <div *ngIf="result" class="result" [class.malignant]="result.class === 'malignant'">
    <div class="result-header">
      <span class="result-label">Resultado</span>
      <span class="result-class">{{ result.class }}</span>
    </div>
    <div class="result-bar-wrap">
      <div class="result-bar" [style.width.%]="result.confidence * 100"></div>
    </div>
    <div class="result-footer">
      <span>Confiança</span>
      <span class="result-pct">{{ result.confidence | percent:'1.1-1' }}</span>
    </div>
  </div>
</div>
